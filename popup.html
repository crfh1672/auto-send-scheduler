<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #fafaf9;
            --card: #ffffff;
            --field: #f3f3f1;
            --line: #ebebe8;
            --text: #191919;
            --muted: #8a8a85;
            --primary: #191919;
            --primary-text: #ffffff;
            --ok: #3f7d58;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --card: #1b1b1b;
                --field: #242424;
                --line: #2c2c2c;
                --text: #ededeb;
                --muted: #8c8c88;
                --primary: #ededeb;
                --primary-text: #121212;
                --ok: #7fc99a;
            }
        }

        * { box-sizing: border-box; }

        body {
            width: 270px;
            margin: 0;
            padding: 14px;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            direction: rtl;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .logo {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--primary);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .logo svg {
            width: 15px; height: 15px;
            fill: none; stroke: var(--primary-text);
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        h1 { font-size: 14px; font-weight: 650; margin: 0; }

        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 5px;
        }

        textarea, input, select {
            width: 100%;
            font: inherit;
            font-size: 13px;
            color: var(--text);
            background: var(--field);
            border: 1px solid transparent;
            border-radius: 10px;
            outline: none;
            padding: 8px 11px;
            margin-bottom: 10px;
            transition: border-color .15s, background .15s;
        }
        textarea:focus, input:focus, select:focus {
            border-color: var(--text);
            background: var(--card);
        }
        select { cursor: pointer; }
        [hidden] { display: none; }
        .status.err { color: #c0392b; }
        textarea { height: 70px; resize: none; line-height: 1.5; }
        textarea::placeholder { color: var(--muted); }

        #runBtn {
            width: 100%;
            padding: 10px;
            margin-top: 2px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: var(--primary-text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s, transform .05s;
        }
        #runBtn:hover { opacity: .88; }
        #runBtn:active { transform: scale(.985); }

        .status {
            margin-top: 8px;
            font-size: 12px;
            color: var(--ok);
            text-align: center;
        }
        .status:empty { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </div>
        <h1>שליחה מתוזמנת</h1>
    </header>

    <label for="messageInput">תוכן ההודעה</label>
    <textarea id="messageInput" placeholder="הכנס את הטקסט לשליחה..."></textarea>

    <label for="modeSelect">מתי לשלוח</label>
    <select id="modeSelect">
        <option value="delay">בעוד זמן מסוים</option>
        <option value="clock">בשעה מסוימת</option>
    </select>

    <div id="delayRow">
        <label for="minutesInput">השהייה (בדקות)</label>
        <input type="number" id="minutesInput" value="1" min="0.5" step="any">
    </div>
    <div id="clockRow" hidden>
        <label for="timeInput">שעה</label>
        <input type="time" id="timeInput">
    </div>

    <button id="runBtn">תזמן הפעלה</button>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
</body>
</html>
